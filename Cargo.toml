[package]
name = "ic-auth-client"
version = "0.49.0"
authors = ["Inomoto, Yota <yota@perforate.org>"]
license = "Apache-2.0"
edition = "2024"
rust-version = "1.95.0"

description = "A client library for Internet Computer identity authentication services."
include = ["/src", "/Cargo.toml", "/README.md", "/LICENSE"]

documentation = "https://docs.rs/ic-auth-client/"
repository = "https://github.com/perforate-org/ic-auth-client-rs/"

# The `ic-agent` minor this release supports. `scripts/check-agent-compat.sh`
# keeps the crate version's minor and the dependency in step with it, so that a
# cargo-visible version bump always means "this pairs with a different ic-agent".
[package.metadata.ic-agent]
minor = "0.49"
tested = "0.49.3"

readme = "README.md"

categories = ["api-bindings", "authentication", "wasm"]
keywords = ["icp", "internet-computer", "identity", "frontend"]

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
base64 = "0.23"
bon = "3"
ed25519-dalek = { version = "3", features = ["rand_core"] }
futures = "0.3"
hex = "0.4"
ic-agent = { version = "0.49", default-features = false }
k256 = "0.13"
p256 = "0.13"
parking_lot = "0.13"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
thiserror = "2"
tracing = { version = "0.1", optional = true }

# The v11 client's internals
async-trait = "0.1"
candid = "0.10"

# `wasm-js` feature
getrandom = { version = "0.4", optional = true }
gloo-timers = { version = "0.4", optional = true, features = ["futures"] }
idb = { version = "0.6", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, default-features = false, features = [
    "BroadcastChannel",
    "Crypto",
    "CryptoKey",
    "CryptoKeyPair",
    "DedicatedWorkerGlobalScope",
    "Document",
    "History",
    "Location",
    "Lock",
    "LockManager",
    "LockManagerSnapshot",
    "MessageEvent",
    "Navigator",
    "Storage",
    "SubtleCrypto",
    "Url",
    "Window",
] }

# `native` feature
chrono = { version = "0.4", optional = true }
futures-timer = "3"
# `keyring` feature
keyring = { version = "4.1", optional = true, features = [
    "apple-native-keyring-store",
    "windows-native-keyring-store",
    "zbus-secret-service-keyring-store",
] }
keyring-core = { version = "1", optional = true }
# `pem` feature
pkcs8 = { version = "0.10", optional = true, features = ["pem"] }
# `android-password` feature
chacha20poly1305 = { version = "0.10", optional = true }
pbkdf2 = { version = "0.12", optional = true }

# `uniffi` feature
uniffi = { version = "0.32", optional = true, features = ["cli"] }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = ["wasm-js"]

# miniserde = []

keyring = ["dep:keyring", "dep:keyring-core"]
pem = ["dep:pkcs8", "ic-agent/pem"]
native = ["dep:chrono"]
tracing = ["dep:tracing"]
wasm-js = [
    "dep:gloo-timers",
    "dep:idb",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "getrandom/wasm_js",
    "ic-agent/wasm-bindgen",
]

# Hidden features

## Enable UniFFI bindings (native only)
uniffi = ["dep:uniffi", "native"]

## Swift bindings (UniFFI)
swift = ["uniffi"]
## Kotlin bindings (UniFFI)
kotlin = ["uniffi", "android-password"]
## Password-based encrypted storage for Android/Kotlin consumers
android-password = ["native", "dep:sha2", "dep:chacha20poly1305", "dep:pbkdf2"]

## Test-only exports for JS/Rust storage compatibility checks (wasm)
wasm-compat-test = ["wasm-js"]

## Internal: suppress wasm-target guard for rust-analyzer
rust-analyzer = []

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
] }
tiny_http = "0.12.0"
webbrowser = "1.2.7"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi/uniffi-bindgen.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory"]

[package.metadata.docs.rs]
# The browser surface is the primary one, so docs.rs builds the wasm target with
# `wasm-js`. The native surface cannot be built for wasm, and the two do not
# compile together on one target (the browser stores are not `Send`, which the
# native bounds require), so it is documented on GitHub Pages instead --- see
# README "Documentation".
default-target = "wasm32-unknown-unknown"
targets = []
features = ["wasm-js", "tracing"]
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(coverage,coverage_nightly)',
] }
