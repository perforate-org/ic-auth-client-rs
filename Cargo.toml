[package]
name = "ic-auth-client"
version = "0.5.0-beta.0"
authors = ["Inomoto, Yota <yota@perforate.org>"]
license = "Apache-2.0"
edition = "2024"
rust-version = "1.85.0"

description = "A client library for Internet Computer identity authentication services."
include = ["/src", "/Cargo.toml", "/README.md", "/LICENSE"]

documentation = "https://docs.rs/ic-auth-client/"
repository = "https://github.com/perforate-org/ic-auth-client-rs/"

readme = "README.md"

categories = ["api-bindings", "authentication", "wasm"]
keywords = ["icp", "internet-computer", "identity", "frontend"]

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
base64 = "0.22"
bon = "3"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
futures = "0.3"
hex = "0.4"
ic-agent = { version = "0.45", default-features = false }
k256 = "0.13"
p256 = "0.13"
parking_lot = "0.12"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tracing = { version = "0.1", optional = true }

# `wasm-js` feature
getrandom = { version = "0.3", optional = true }
gloo-events = { version = "0.2", optional = true }
gloo-timers = { version = "0.3", optional = true, features = ["futures"] }
gloo-utils = { version = "0.2", optional = true }
idb = { version = "0.6", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
wasm-timer = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, default-features = false, features = [
    "Crypto",
    "CryptoKey",
    "CryptoKeyPair",
    "MessageEvent",
    "SubtleCrypto",
    "Storage",
    "Url",
    "Window",
] }

# `native` feature
chrono = { version = "0.4", optional = true }
futures-timer = "3.0"
percent-encoding = { version = "2.3", optional = true }
url = { version = "2", optional = true }
# `keyring` feature
keyring = { version = "3", optional = true, features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }
# `pem` feature
pkcs8 = { version = "0.10", optional = true, features = ["pem"] }

# `uniffi` feature
uniffi = { version = "0.31", optional = true, features = ["cli"] }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
serde_test = "1.0"
wasm-bindgen-test = "0.3"

[features]
default = ["wasm-js"]

# miniserde = []

keyring = ["dep:keyring"]
pem = ["dep:pkcs8", "ic-agent/pem"]
native = ["dep:chrono", "dep:percent-encoding", "dep:url"]
tracing = ["dep:tracing"]
wasm-js = [
    "dep:gloo-events",
    "dep:gloo-timers",
    "dep:gloo-utils",
    "dep:idb",
    "dep:serde-wasm-bindgen",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:wasm-timer",
    "dep:web-sys",
    "getrandom/wasm_js",
    "ic-agent/wasm-bindgen",
]

# Hidden features

## Enable UniFFI bindings (native only)
uniffi = ["dep:sha2", "dep:uniffi", "native"]

## Swift bindings (UniFFI)
swift = ["uniffi"]

## Test-only exports for JS/Rust storage compatibility checks (wasm)
wasm-compat-test = ["wasm-js"]

## Internal: suppress wasm-target guard for rust-analyzer
rust-analyzer = []

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
portpicker = "0.1"
rdev = "0.5"
tiny_http = "0.12"
webbrowser = "1.0"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi/uniffi-bindgen.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory"]

[package.metadata.docs.rs]
features = ["keyring", "pem", "native", "tracing", "wasm-js"]
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(coverage,coverage_nightly)',
] }
