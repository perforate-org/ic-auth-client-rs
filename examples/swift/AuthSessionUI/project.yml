name: AuthSessionUI
options:
  bundleIdPrefix: org.perforate.ic-auth-client
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
settings:
  base:
    DEAD_CODE_STRIPPING: YES
    ENABLE_STRING_CATALOG_SYMBOL_GENERATION: YES
packages:
  IcAuthClient:
    path: ../../../
  IcpKit:
    url: https://github.com/wiyota/IcpKit.git
    branch: for-ic-auth-client
schemes:
  AuthSessionUI-iOS:
    build:
      targets:
        AuthSessionUI-iOS: all
    run:
      config: Debug
  AuthSessionUI-macOS:
    build:
      targets:
        AuthSessionUI-macOS: all
    run:
      config: Debug
targets:
  AuthSessionUI-iOS:
    type: application
    platform: iOS
    sources:
      - Shared
    info:
      path: iOS/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - $(REDIRECT_SCHEME)
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.perforate.ic-auth-client.AuthSessionUI-iOS
      REDIRECT_SCHEME: authsessionui
      ENABLE_USER_SCRIPT_SANDBOXING: YES
      DEAD_CODE_STRIPPING: YES
    dependencies:
      - package: IcAuthClient
      - package: IcpKit
    preBuildScripts:
      - name: Generate Env.swift
        inputFiles:
          - $(PROJECT_DIR)/.env
        outputFiles:
          - $(PROJECT_DIR)/Shared/Generated/Env.swift
        script: |
          set -euo pipefail
          ENV_FILE="${PROJECT_DIR}/.env"
          OUT_DIR="${PROJECT_DIR}/Shared/Generated"
          OUT_FILE="${OUT_DIR}/Env.swift"
          export ENV_FILE OUT_FILE
          python3 - <<'PY'
          import os
          import sys

          env_file = os.environ["ENV_FILE"]
          out_file = os.environ["OUT_FILE"]
          defaults = {
              "CANISTER_ID_II_BRIDGE": "",
              "CANISTER_ID_BACKEND": "",
              "DFX_NETWORK": "ic",
          }

          values = {}
          try:
              with open(env_file, "r", encoding="utf-8") as handle:
                  for raw_line in handle:
                      line = raw_line.strip()
                      if not line or line.startswith("#") or "=" not in line:
                          continue
                      key, value = line.split("=", 1)
                      key = key.strip()
                      value = value.strip()
                      if len(value) >= 2 and value[0] == value[-1] and value[0] in ("\"", "'"):
                          value = value[1:-1]
                      values[key] = value
          except FileNotFoundError:
              pass

          def swift_escape(text):
              return text.replace("\\\\", "\\\\\\\\").replace("\"", "\\\\\"")

          ii_bridge_id = values.get("CANISTER_ID_II_BRIDGE", defaults["CANISTER_ID_II_BRIDGE"])
          backend_id = values.get("CANISTER_ID_BACKEND", defaults["CANISTER_ID_BACKEND"])
          dfx_network = values.get("DFX_NETWORK", defaults["DFX_NETWORK"])
          content = "\n".join([
              "// Generated by Xcode build script. Do not edit.",
              "enum Env {",
              f"    static let canisterIdIiBridge = \"{swift_escape(ii_bridge_id)}\"",
              f"    static let canisterIdBackend = \"{swift_escape(backend_id)}\"",
              f"    static let dfxNetwork = \"{swift_escape(dfx_network)}\"",
              "}",
              "",
          ])

          os.makedirs(os.path.dirname(out_file), exist_ok=True)
          with open(out_file, "w", encoding="utf-8") as handle:
              handle.write(content)
          PY
